mo_ta_vi: |-
  Bộ tranh minh họa được thực hiện theo đơn đặt hàng của gia đình chị Mai - người Dao Tiền sinh sống tại bản Sưng, Đà Bắc. Lấy cảm hứng từ ý niệm “Lưu dấu”, bộ tranh khai thác những dấu ấn văn hóa của người Dao Tiền tại bản Sưng, Đà Bắc, thông qua chữ viết Nôm Dao Tiền và nghề làm giấy dó thủ công truyền thống.

  Các tác phẩm tái hiện hai công đoạn đặc trưng trong quá trình làm giấy: seo giấy và dán giấy dó. Ngoài ra, tác phẩm còn thể hiện dấu vết văn hóa bản địa qua chữ viết Nôm Dao mà người Dao Tiền để lại trên giấy qua nhiều thời kỳ. Qua từng nét vẽ, bộ tranh không chỉ giới thiệu sản phẩm giấy dó nguyên chất được làm thủ công bởi người dân bản địa, mà còn góp phần lưu giữ và lan tỏa những giá trị văn hóa gắn liền với đời sống của cộng đồng người Dao Tiền.

  Không chỉ hướng đến việc quảng bá sản phẩm, dự án còn là dịp lan tỏa những giá trị văn hóa của cộng đồng người Dao Tiền, góp phần đưa nghề làm giấy dó truyền thống đến gần hơn với công chúng.
mo_ta_en: |-
  This illustration series was commissioned by Ms. Mai’s family, members of the Dao Tien community living in Ban Sung, Da Bac, Vietnam. Inspired by the concept of “Imprints”, the series explores the cultural heritage of the Dao Tien people through their traditional Nom Dao script and the craft of handmade dó paper.

  The illustrations depict two distinctive stages of the papermaking process: forming the paper sheets on a mould and drying them. They also capture traces of local heritage through Nom Dao characters, preserved on paper and passed down through generations.

  Through each illustration, the series introduces pure handmade dó paper produced by local artisans, while celebrating and preserving the cultural values woven into the everyday life of the Dao Tien community.

  Beyond promoting the product, the project seeks to bring greater visibility to the traditional craft of dó papermaking and share the cultural heritage of the Dao Tien people with a wider audience.
