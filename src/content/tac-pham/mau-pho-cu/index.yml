mo_ta_vi: |-
  MỜI LÊN NGỰA

  Khép lại một chặng đường, mỗi người đều mang theo những dấu ấn và bài học riêng. Trên lưng chú ngựa chín hồng mao, hành trang ấy hóa thành động lực để tiếp tục rong ruổi trên những miền đất mới.

  Lấy cảm hứng từ hình tượng ngựa và tinh thần phiêu lưu, tác phẩm là lời mời bước lên yên, bỏ lại những ngần ngại phía sau và đón chờ những điều chưa biết. Bởi hành trình phía trước luôn rộng mở với những ai sẵn sàng lên đường.
mo_ta_en: |-
  HOP ON, LET’S RIDE

  As one chapter comes to an end, we carry its lessons and memories with us into the next. Riding on the back of the Nine-Red-Mane Horse, these experiences become the fuel for another journey ahead.

  Rooted in the rich cultural traditions of the East and inspired by the festive spirit of Vietnamese Lunar New Year, this artwork draws on the horse as a symbol of movement, renewal, and new beginnings. It captures the excitement of setting off on a new journey — carrying the past with us, embracing the unknown, and welcoming the possibilities that lie ahead.

  So, hop on and let the journey begin!
