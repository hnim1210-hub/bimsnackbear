tieu_de_en: Lands born of *imagination*
gioi_thieu_vi: |-
  [Xin chào, mình là Hoàng Ngân – họa sĩ minh họa với bút danh BIM / SnacK Bear.

  Mình tạo nên những miền đất qua nét vẽ, lấy cảm hứng từ cổ tích, văn hóa và trí tưởng tượng. Từ vẻ huyền bí của phương Đông đến nét lãng mạn của châu Âu, mỗi bức tranh là một câu chuyện nhỏ mang màu sắc riêng – bay bổng, mộng mơ nhưng cũng đầy chiều sâu.]

  [Một thế giới nhỏ đầy diệu kỳ]
gioi_thieu_en: |-
  [Hello, I'm Hoàng Ngân, an illustrator working under the names BIM / SnacK Bear.

  I create little worlds through illustration, drawing inspiration from fairy tales, culture, and imagination. From the mystique of the East to the romantic charm of the West, each artwork tells a story of its own — whimsical, dreamlike, yet filled with depth.]

  [A little world of wonder]
